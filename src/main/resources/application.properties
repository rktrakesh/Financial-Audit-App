# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/financial_audit_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.com.auditSystem=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
app.jwt.secret=financialAuditSystemSecretKey2024VeryLongAndSecureKeyForProduction
app.jwt.expiration=86400000

# Fraud Detection Rules (configurable)
app.fraud.large-transaction-threshold=10000.00
app.fraud.rapid-transaction-limit=5
app.fraud.rapid-transaction-window-minutes=10
app.fraud.suspicious-hour-start=0
app.fraud.suspicious-hour-end=5

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.syntaxHighlight.activate=true
springdoc.swagger-ui.presets=swagger-ui.presets.apis,swagger-ui.SwaggerUIBundle.presets.layouts
springdoc.use-fqn=true
