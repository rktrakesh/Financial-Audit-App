# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/financial_audit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.auditSystem=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/financial-audit-system.log
logging.file.max-size=100MB
logging.file.max-history=30

# JWT Configuration
app.jwt.secret=financialAuditSystemSecretKey2024VeryLongAndSecureKeyForProduction
app.jwt.expiration=86400000

# Fraud Detection Rules (configurable)
app.fraud.large-transaction-threshold=10000.00
app.fraud.rapid-transaction-limit=5
app.fraud.rapid-transaction-window-minutes=10
app.fraud.suspicious-hour-start=0
app.fraud.suspicious-hour-end=5

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
